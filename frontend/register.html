<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <main class="container py-5" style="max-width:420px;">
    <h1 class="h4 mb-2 text-center">Create an account</h1>
    <p class="text-center small text-secondary mb-4">Get an automatic discount on every order.</p>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small">Email</label>
        <input type="email" class="form-control" id="regEmail" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small">Password <span class="text-secondary">(min. 8 characters)</span></label>
        <input type="password" class="form-control" id="regPassword" minlength="8" required autocomplete="new-password">
      </div>
      <div class="alert alert-danger small d-none" id="registerError"></div>
      <button type="submit" class="btn btn-primary w-100" id="registerBtn">Create account</button>
    </form>

    <p class="text-center small text-secondary mt-3">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/register.js"></script>
</body>

</html>
