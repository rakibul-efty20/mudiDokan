<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <main class="container py-5" style="max-width:420px;">
    <h1 class="h4 mb-4 text-center">Log in</h1>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small">Email</label>
        <input type="email" class="form-control" id="loginEmail" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="alert alert-danger small d-none" id="loginError"></div>
      <button type="submit" class="btn btn-primary w-100" id="loginBtn">Log in</button>
    </form>

    <p class="text-center small text-secondary mt-3">
      New here? <a href="register.html">Create an account</a> — accounts get an automatic discount at checkout.
    </p>

    <div class="alert alert-secondary small mt-4">
      <strong>Demo accounts</strong><br>
      Admin: <code>admin@supershop.local</code> / <code>ChangeMe123!</code><br>
      Shopkeeper: <code>shopkeeper@supershop.local</code> / <code>ChangeMe123!</code>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
