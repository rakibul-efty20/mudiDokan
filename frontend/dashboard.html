<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <div id="accessDenied" class="container py-5 text-center d-none">
    <h1 class="h4">Shopkeeper/Admin access required</h1>
    <p class="text-secondary">Log in with a shopkeeper or admin account to view this page.</p>
    <a href="login.html?next=dashboard.html" class="btn btn-primary">Log in</a>
  </div>

  <main class="container py-4 d-none" id="dashboardMain">
    <h1 class="h4 mb-4">Dashboard</h1>

    <section class="row g-3 mb-5" id="earningsCards">
      <div class="col-6 col-lg-3">
        <div class="card p-3 h-100">
          <div class="small text-secondary">Total earnings</div>
          <div class="fs-4 fw-bold price" id="statTotal">&mdash;</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card p-3 h-100">
          <div class="small text-secondary">This month</div>
          <div class="fs-4 fw-bold price" id="statMonth">&mdash;</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card p-3 h-100">
          <div class="small text-secondary">This week</div>
          <div class="fs-4 fw-bold price" id="statWeek">&mdash;</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card p-3 h-100">
          <div class="small text-secondary">Orders placed</div>
          <div class="fs-4 fw-bold" id="statOrders">&mdash;</div>
        </div>
      </div>
    </section>

    <section class="row g-4">
      <div class="col-lg-4">
        <div class="card p-3">
          <h2 class="h6 mb-3">Forecast an item</h2>
          <form id="forecastForm">
            <div class="mb-3">
              <label class="form-label small">Item <span class="text-secondary" id="catalogCount"></span></label>
              <input type="text" class="form-control" id="itemInput" list="itemOptions" placeholder="Start typing…"
                value="whole milk" required autocomplete="off">
              <datalist id="itemOptions"></datalist>
            </div>
            <div class="mb-3">
              <label class="form-label small">Year</label>
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="form-control" id="yearInput" value="2015"
                required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="forecastBtn">
              <span id="forecastBtnLabel">Forecast the year</span>
            </button>
          </form>
          <div class="alert alert-danger small mt-3 d-none" id="forecastError"></div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-3">
          <h2 class="h6 mb-3">Seasonal curve</h2>
          <div id="chartEmpty" class="empty-state">Forecast an item to see its monthly demand curve here.</div>
          <div id="chartReady" class="d-none">
            <div class="chart-bars" id="chartBars"></div>
            <div class="chart-labels" id="chartLabels"></div>
            <div class="small text-secondary text-center mt-3" id="chartTotal"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
