<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MudiDokan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <div id="homeCarousel" class="carousel slide container mt-3" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="0" class="active" aria-current="true"
        aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="images/carousel/carousel1.jpg" class="d-block w-100 carousel-img" alt="Promotion 1"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="carousel-placeholder" style="display:none;">carousel1.jpg</div>
      </div>
      <div class="carousel-item">
        <img src="images/carousel/carousel2.jpg" class="d-block w-100 carousel-img" alt="Promotion 2"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="carousel-placeholder" style="display:none;">carousel2.jpg</div>
      </div>
      <div class="carousel-item">
        <img src="images/carousel/carousel3.jpg" class="d-block w-100 carousel-img" alt="Promotion 3"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="carousel-placeholder" style="display:none;">carousel3.jpg</div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <main class="container py-5">

    <section class="mb-5">
      <h2 class="h4 mb-4">Shop by category</h2>
      <div class="row g-3" id="categoryTiles">
        <!-- injected by home.js -->
      </div>
    </section>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0">Popular picks</h2>
        <a href="products.html" class="small">View all &rarr;</a>
      </div>
      <div class="row g-3" id="featuredProducts">
        <!-- injected by home.js -->
      </div>
    </section>

  </main>

  <footer class="border-top py-4 mt-5">
    <div class="container text-center small text-secondary">
      DokanCast Mart &mdash; cash on delivery only, for now.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
