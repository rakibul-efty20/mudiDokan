<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DokanCast Mart — Fresh groceries, delivered</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var stored = localStorage.getItem("supershop_theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-bs-theme", theme);
  })();
</script>
</head>
<body>

<div id="navbarMount"></div>

<header class="py-5 border-bottom" style="background: var(--brand-accent-soft);">
  <div class="container text-center py-4">
    <span class="badge rounded-pill text-bg-light mb-3 border">167 items · fresh every week</span>
    <h1 class="display-5 fw-bold" style="font-family:'Space Mono',monospace;">Fresh groceries, delivered</h1>
    <p class="lead text-secondary col-lg-6 mx-auto">Bread, dairy, produce, and everything else for the week — browse by
      category or search for exactly what you need.</p>
    <a href="products.html" class="btn btn-primary btn-lg mt-2">Shop all products</a>
  </div>
</header>

<main class="container py-5">

  <section class="mb-5">
    <h2 class="h4 mb-4">Shop by category</h2>
    <div class="row g-3" id="categoryTiles">
      <!-- injected by home.js -->
    </div>
  </section>

  <section>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 mb-0">Popular picks</h2>
      <a href="products.html" class="small">View all &rarr;</a>
    </div>
    <div class="row g-3" id="featuredProducts">
      <!-- injected by home.js -->
    </div>
  </section>

</main>

<footer class="border-top py-4 mt-5">
  <div class="container text-center small text-secondary">
    DokanCast Mart &mdash; cash on delivery only, for now.
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/navbar.js"></script>
<script src="js/home.js"></script>
</body>
</html>
