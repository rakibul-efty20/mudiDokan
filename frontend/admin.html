<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <div id="accessDenied" class="container py-5 text-center d-none">
    <h1 class="h4">Admin access required</h1>
    <p class="text-secondary">Only the admin role can manage inventory, promo codes, and user roles.</p>
    <a href="login.html?next=admin.html" class="btn btn-primary">Log in</a>
  </div>

  <main class="container py-4 d-none" id="adminMain">
    <h1 class="h4 mb-4">Admin</h1>

    <ul class="nav nav-tabs mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab"
          data-bs-target="#tabInventory">Inventory</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPromo">Promo Codes</button>
      </li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabUsers">Users &amp;
          Roles</button></li>
    </ul>

    <div class="tab-content">

      <!-- INVENTORY -->
      <div class="tab-pane fade show active" id="tabInventory">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <input type="text" class="form-control" id="invSearch" placeholder="Search products…"
            style="max-width:260px;">
          <select class="form-select" id="invCategoryFilter" style="max-width:220px;">
            <option value="">All categories</option>
          </select>
          <span class="align-self-center small text-secondary" id="invCount"></span>
        </div>
        <div class="table-responsive">
          <table class="table align-middle" id="inventoryTable">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price (Tk)</th>
                <th>Stock</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </div>

      <!-- PROMO CODES -->
      <div class="tab-pane fade" id="tabPromo">
        <div class="card p-3 mb-4" style="max-width:480px;">
          <h2 class="h6 mb-3">Create promo code</h2>
          <form id="promoForm" class="row g-2">
            <div class="col-12">
              <input type="text" class="form-control" id="promoCodeInput" placeholder="CODE (e.g. WELCOME10)" required
                style="text-transform:uppercase;">
            </div>
            <div class="col-6">
              <select class="form-select" id="promoTypeInput">
                <option value="percentage">Percentage %</option>
                <option value="fixed">Fixed Tk</option>
              </select>
            </div>
            <div class="col-6">
              <input type="text" inputmode="numeric" pattern="[0-9]*" class="form-control" id="promoValueInput"
                placeholder="Value" required>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">Create</button>
            </div>
          </form>
          <div class="alert alert-danger small mt-2 d-none" id="promoError"></div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Code</th>
                <th>Type</th>
                <th>Value</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="promoBody"></tbody>
          </table>
        </div>
      </div>

      <!-- USERS & ROLES -->
      <div class="tab-pane fade" id="tabUsers">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Email</th>
                <th>Current role</th>
                <th>Joined</th>
                <th>Change role</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
