<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme =
        stored ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <div id="categoryBannerWrap" class="d-none container mt-3">
    <img id="categoryBannerImg" class="w-100 carousel-img" alt="" />
    <div id="categoryBannerPlaceholder" class="carousel-placeholder" style="display: none"></div>
  </div>

  <main class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active" id="pageTitleCrumb">Products</li>
      </ol>
    </nav>

    <h1 class="h4 mb-4" id="pageTitle">All products</h1>

    <div id="productsGrid" class="row g-3">
      <!-- injected by products.js -->
    </div>
  </main>

  <footer class="border-top py-4 mt-5">
    <div class="container text-center small text-secondary">
      DokanCast Mart &mdash; cash on delivery only, for now.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/products.js"></script>
</body>

</html>
