<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — DokanCast Mart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var stored = localStorage.getItem("supershop_theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<body>

  <div id="navbarMount"></div>

  <main class="container py-4">
    <h1 class="h4 mb-4">Checkout</h1>

    <div id="checkoutEmpty" class="empty-state d-none">
      <p>Your cart is empty.</p>
      <a href="products.html" class="btn btn-primary">Browse products</a>
    </div>

    <div id="checkoutContent" class="row g-4">
      <div class="col-lg-7">
        <form id="checkoutForm">
          <div id="guestFields">
            <h2 class="h6 mb-3" id="contactHeading">Delivery details</h2>
            <div class="mb-3">
              <label class="form-label small">Full name</label>
              <input type="text" class="form-control" id="guestName" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">Phone number</label>
              <input type="text" class="form-control" id="guestPhone" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">Delivery address</label>
              <textarea class="form-control" id="guestAddress" rows="2" required></textarea>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small">Promo code <span class="text-secondary">(optional)</span></label>
            <input type="text" class="form-control" id="promoCode" placeholder="e.g. WELCOME10">
          </div>

          <div class="alert alert-secondary small">Payment: cash on delivery only, for now.</div>

          <div class="alert alert-danger small d-none" id="checkoutError"></div>

          <button type="submit" class="btn btn-primary w-100" id="placeOrderBtn">
            <span id="placeOrderLabel">Place order</span>
          </button>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="card p-3">
          <h2 class="h6">Order summary</h2>
          <div id="summaryItems" class="small mb-3"></div>
          <hr>
          <div class="d-flex justify-content-between small"><span>Subtotal</span><span id="sumSubtotal"></span></div>
          <div class="d-flex justify-content-between small text-success" id="sumDiscountRow">
            <span>Account discount</span><span id="sumDiscount"></span>
          </div>
          <div class="d-flex justify-content-between fw-bold mt-2"><span>Total</span><span id="sumTotal"></span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/checkout.js"></script>
</body>

</html>
