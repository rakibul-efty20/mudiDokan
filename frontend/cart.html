<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — DokanCast Mart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var stored = localStorage.getItem("supershop_theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-bs-theme", theme);
  })();
</script>
</head>
<body>

<div id="navbarMount"></div>

<main class="container py-4">
  <h1 class="h4 mb-4">Your cart</h1>

  <div id="cartEmpty" class="empty-state d-none">
    <p>Your cart is empty.</p>
    <a href="products.html" class="btn btn-primary">Browse products</a>
  </div>

  <div id="cartContent" class="row g-4">
    <div class="col-lg-8">
      <div id="cartItems" class="d-flex flex-column gap-3"></div>
    </div>
    <div class="col-lg-4">
      <div class="card p-3">
        <h2 class="h6">Order summary</h2>
        <div class="d-flex justify-content-between small mb-2">
          <span>Subtotal</span><span id="summarySubtotal">Tk 0</span>
        </div>
        <p class="small text-secondary mb-3" id="discountHint"></p>
        <a href="checkout.html" class="btn btn-primary w-100">Proceed to checkout</a>
      </div>
    </div>
  </div>
</main>

<footer class="border-top py-4 mt-5">
  <div class="container text-center small text-secondary">DokanCast Mart &mdash; cash on delivery only, for now.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/navbar.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
